baseURL = "https://trellis.dev/"
title = "Trellis"
languageCode = "en-us"

enableRobotsTXT = true
canonifyURLs = true

[params]
  description = "An AI-native development environment. Claude and Codex sessions, service logs, distributed traces, and crash reports — scoped to your git worktrees in one keyboard-driven interface."
  image = "/images/social-preview.png"

[mediaTypes."text/markdown"]
  suffixes = ["md"]

[outputFormats.Markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../docs"
    target = "content/docs"
    excludeFiles = ["pair-testing/**"]

